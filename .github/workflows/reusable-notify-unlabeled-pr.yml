name: Reusable • Notify PR author if no labels

on:
  workflow_call:
    inputs:
      grace_seconds:
        type: number
        default: 120
      helper_label:
        type: string
        default: needs-label
      comment_text:
        type: string
        # Keep this generic; defaults with ${{ }} won't interpolate here.
        default: "Hi @${pull_request.user.login} — please add at least one label so we can triage this pull request."

jobs:
  notify:
    if: ${{ github.event.pull_request != null }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Grace period
        run: sleep ${{ inputs.grace_seconds }}

      - name: Comment if still unlabeled
        uses: actions/github-script@v7
        env:
          HELPER_LABEL: ${{ inputs.helper_label }}
          COMMENT_TEXT: ${{ inputs.comment_text }}
        with:
          script: |
            const pullRequest = context.payload.pull_request
            if (!pullRequest) {
              core.info('No pull request payload. Skipping.')
              return
            }
            // Skip bots and already-labeled pull requests
            if ((pullRequest.user?.type || '').toLowerCase() === 'bot') return
            if ((pullRequest.labels || []).length > 0) return

            const helperLabel = process.env.HELPER_LABEL
            if (helperLabel) {
              try {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pullRequest.number,
                  labels: [helperLabel]
                })
              } catch (e) {
                core.info(`Could not add helper label: ${e.message}`)
              }
            }

            // Build comment body safely
            let body = (process.env.COMMENT_TEXT || '').trim()
            if (!body) {
              body = `Hi @${pullRequest.user.login} — please add at least one label so we can triage this pull request.`
            } else {
              // Allow the placeholder to be replaced
              body = body.replaceAll('${pull_request.user.login}', pullRequest.user.login)
            }

            // Final guard just in case
            if (!body.trim()) {
              throw new Error('Computed comment body is blank')
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullRequest.number,
              body
            })
