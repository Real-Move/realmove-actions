name: Reusable • Trigger target workflow

on:
  workflow_call:
    inputs:
      repo_owner:
        description: "Owner of the target repository"
        required: false
        type: string
        default: "Real-Move"

      repo_name:
        description: "Name of the target repository"
        required: true
        type: string

      event_type:
        description: "repository_dispatch event_type sent to target repository"
        required: true
        type: string

      branch_name:
        description: "Branch name to forward in client_payload; defaults to current ref name"
        required: false
        type: string

      is_pull_request:
        description: "Whether the source workflow was triggered by a pull request"
        required: false
        type: boolean
        default: false

      source_repo:
        description: "Source repository to report status back to"
        required: false
        type: string

      source_sha:
        description: "Source commit SHA to report status back to"
        required: false
        type: string

    secrets:
      TRIGGER_TARGET_PAT:
        required: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Workflow in Another Repository
        env:
          REPO_OWNER: ${{ inputs.repo_owner }}
          REPO_NAME: ${{ inputs.repo_name }}
          EVENT_TYPE: ${{ inputs.event_type }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
          DEFAULT_BRANCH_NAME: ${{ github.ref_name }}
          IS_PULL_REQUEST: ${{ inputs.is_pull_request }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_TARGET_PAT: ${{ secrets.TRIGGER_TARGET_PAT }}
        run: |
          set -euo pipefail

          branch_name="${INPUT_BRANCH_NAME:-$DEFAULT_BRANCH_NAME}"

          if [ "${IS_PULL_REQUEST}" = "true" ] && [ -n "${SOURCE_REPO}" ] && [ -n "${SOURCE_SHA}" ]; then
            echo "Creating pending status on ${SOURCE_REPO}@${SOURCE_SHA}"

            status_code=$(curl -sS -L -o /tmp/status_response.txt -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TRIGGER_TARGET_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/statuses/${SOURCE_SHA}" \
              -d "{\"state\":\"pending\",\"description\":\"Target container build is running\",\"context\":\"target/usb-cam-ros-humble-build\"}")

            cat /tmp/status_response.txt

            if [ "$status_code" != "201" ]; then
              echo "Failed to create pending status. HTTP $status_code"
              exit 1
            fi
          fi

          echo "Dispatching ${EVENT_TYPE} to ${REPO_OWNER}/${REPO_NAME}"

          dispatch_code=$(curl -sS -L -o /tmp/dispatch_response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TRIGGER_TARGET_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches" \
            -d "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"branch_name\":\"${branch_name}\",\"is_pull_request\":\"${IS_PULL_REQUEST}\",\"source_repo\":\"${SOURCE_REPO}\",\"source_sha\":\"${SOURCE_SHA}\"}}")

          cat /tmp/dispatch_response.txt

          if [ "$dispatch_code" != "204" ]; then
            echo "Failed to dispatch target workflow. HTTP $dispatch_code"
            exit 1
          fi

          echo "Dispatch sent successfully"
