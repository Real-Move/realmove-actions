name: Reusable • ROS CI Test Build

on:
  workflow_call:
    inputs:
      ros_distro:
        type: string
        default: humble
      workspace_mode:
        type: string
        default: deps # deps | core
      deps_repos_file:
        type: string
        default: ""
      skip_tests:
        type: boolean
        default: true
      skip_rosdep_install:
        type: boolean
        default: false
      rosdep_check:
        type: boolean
        default: false
    secrets:
      REPO_ORG_PAT:
        required: true
      GCR_PAT:
        description: Optional GHCR read token; defaults to REPO_ORG_PAT.
        required: false

jobs:
  build:
    name: ROS CI Test Build
    runs-on: [self-hosted, linux, x64]
    container:
      image: ghcr.io/real-move/ros-ci:${{ inputs.ros_distro }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GCR_PAT || secrets.REPO_ORG_PAT }}
      volumes:
        - realmove-ros-ci-ccache:/ccache
      env:
        CCACHE_DIR: /ccache/${{ github.repository }}/${{ inputs.ros_distro }}/amd64
        CCACHE_MAXSIZE: 5G
        CCACHE_COMPILERCHECK: content
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v5

      - name: Prepare compiler cache
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_STATSLOG=$RUNNER_TEMP/ros-ci-ccache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" >> "$GITHUB_ENV"

      - name: Check optional dependency repos file
        id: deps_repos
        if: ${{ inputs.workspace_mode == 'deps' && inputs.deps_repos_file != '' }}
        shell: bash
        env:
          DEPS_REPOS_FILE: ${{ inputs.deps_repos_file }}
        run: |
          if [[ "$DEPS_REPOS_FILE" == http://* || "$DEPS_REPOS_FILE" == https://* || -f "${DEPS_REPOS_FILE#file://}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Configured deps_repos_file does not exist; continuing without extra repository imports."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ✅ deps WITHOUT extra repos
      - name: Build deps (no extra repos)
        id: build_deps
        if: ${{ inputs.workspace_mode == 'deps' && steps.deps_repos.outputs.available != 'true' }}
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ inputs.ros_distro }}
          import-token: ${{ secrets.REPO_ORG_PAT }}
          skip-tests: ${{ inputs.skip_tests }}
          skip-rosdep-install: ${{ inputs.skip_rosdep_install }}
          rosdep-check: ${{ inputs.rosdep_check }}
          coverage-result: false

      # ✅ deps WITH repos file
      - name: Build deps (with repos file)
        id: build_deps_repos
        if: ${{ inputs.workspace_mode == 'deps' && steps.deps_repos.outputs.available == 'true' }}
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ inputs.ros_distro }}
          import-token: ${{ secrets.REPO_ORG_PAT }}
          vcs-repo-file-url: ${{ inputs.deps_repos_file }}
          skip-tests: ${{ inputs.skip_tests }}
          skip-rosdep-install: ${{ inputs.skip_rosdep_install }}
          rosdep-check: ${{ inputs.rosdep_check }}
          coverage-result: false

      - name: Checkout realmove-actions core workspace file
        if: ${{ inputs.workspace_mode == 'core' }}
        uses: actions/checkout@v5
        with:
          repository: Real-Move/realmove-actions
          ref: main
          token: ${{ secrets.REPO_ORG_PAT }}
          path: realmove-actions
          sparse-checkout: |
            .github/workflows/core.repos
          sparse-checkout-cone-mode: false

      # ✅ core mode
      - name: Build core workspace
        id: build_core
        if: ${{ inputs.workspace_mode == 'core' }}
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ inputs.ros_distro }}
          import-token: ${{ secrets.REPO_ORG_PAT }}
          vcs-repo-file-url: realmove-actions/.github/workflows/core.repos
          skip-tests: ${{ inputs.skip_tests }}
          skip-rosdep-install: ${{ inputs.skip_rosdep_install }}
          rosdep-check: ${{ inputs.rosdep_check }}
          rosdep-skip-keys: pinocchio
          coverage-result: false

      - name: Report ROS build and test summary
        if: always()
        shell: bash
        env:
          ROS_DISTRO_NAME: ${{ inputs.ros_distro }}
          WORKSPACE_MODE: ${{ inputs.workspace_mode }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          JOB_STATUS: ${{ job.status }}
          DEPS_AVAILABLE: ${{ steps.deps_repos.outputs.available }}
          DEPS_RESULT: ${{ steps.build_deps.outcome }}
          DEPS_REPOS_RESULT: ${{ steps.build_deps_repos.outcome }}
          CORE_RESULT: ${{ steps.build_core.outcome }}
          ROS_WORKSPACE: ${{ steps.build_deps.outputs['ros-workspace-directory-name'] || steps.build_deps_repos.outputs['ros-workspace-directory-name'] || steps.build_core.outputs['ros-workspace-directory-name'] }}
        run: |
          if [[ "$WORKSPACE_MODE" == core ]]; then
            result="$CORE_RESULT"
            dependencies='Core workspace'
          elif [[ "$DEPS_AVAILABLE" == true ]]; then
            result="$DEPS_REPOS_RESULT"
            dependencies='Configured repos file'
          else
            result="$DEPS_RESULT"
            dependencies='No extra repository imports'
          fi
          {
            echo '### ROS build and tests'
            echo
            echo '| Item | Result |'
            echo '| --- | --- |'
            printf '| Job status | %s |\n' "$JOB_STATUS"
            printf '| ROS distribution | %s |\n' "$ROS_DISTRO_NAME"
            printf '| Workspace mode | %s |\n' "$WORKSPACE_MODE"
            printf '| Dependencies | %s |\n' "$dependencies"
            printf '| ROS CI action | %s |\n' "${result:-not run}"
            echo
            if [[ "$SKIP_TESTS" == true ]]; then
              echo 'Tests were disabled by the caller (`skip_tests: true`).'
            elif [[ -n "$ROS_WORKSPACE" && -d "$ROS_WORKSPACE/build" ]]; then
              echo 'Available test results (may be incomplete if the ROS CI action failed):'
              echo
              echo '```text'
              if ! colcon test-result --test-result-base "$ROS_WORKSPACE/build"; then
                echo 'Test-result reporting returned a nonzero status; inspect the ROS CI step logs.'
              fi
              echo '```'
            else
              echo 'No test results are available; see the ROS CI step logs for setup or build failures.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          {
            echo '### Compiler cache'
            if [[ -f "$CCACHE_STATSLOG" ]]; then
              echo 'This run:'
              echo '```text'
              ccache --show-log-stats
              echo '```'
            fi
            echo 'Persistent cache totals (all runs for this repository and distro):'
            echo '```text'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
