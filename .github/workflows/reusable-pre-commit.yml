name: Reusable • Pre-Commit Checks

on:
  workflow_call:

jobs:
  pre-commit:
    concurrency:
      group: pre-commit-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        id: python

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit run --all-files || {
            echo "❌ Pre-commit checks failed!"
            echo ""
            echo "👉 Run this locally to fix:"
            echo "   pip install pre-commit"
            echo "   pre-commit install"
            echo "   pre-commit run --all-files"
            exit 1
          }
